# GitLab pipeline mirroring .github/workflows/ci.yml.
#
# Three stages, same as the GitHub Actions config:
#   lint  — ruff check + ruff format --check
#   test  — pytest -v (24 unit tests)
#   smoke — end-to-end run of `python -m src.main` against the bundled
#           dataset using the deterministic mock provider
#
# Pipeline runs on every push and on merge requests. Default-branch runs
# also produce coverage-style artifacts (the JSON report) for download.

default:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

stages:
  - lint
  - test
  - smoke

.python-setup: &python-setup
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r requirements-dev.txt

lint:
  stage: lint
  <<: *python-setup
  script:
    - ruff check .
    - ruff format --check .

test:
  stage: test
  <<: *python-setup
  script:
    - pytest -v

smoke:
  stage: smoke
  before_script:
    - python -V
    - pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - python -m src.main --config config.yaml
  artifacts:
    when: always
    paths:
      - reports/
    expire_in: 1 week

workflow:
  rules:
    # Run on every push to a branch …
    - if: $CI_PIPELINE_SOURCE == "push"
    # … and on every merge request.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
